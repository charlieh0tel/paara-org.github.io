name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-new-meeting:
    name: Test new-meeting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a meeting, then confirm a second run refuses
        run: |
          script/new-meeting 209901
          test -f meetings/2099/209901.md
          test -f _includes/raffle/209901.md
          if script/new-meeting 209901; then
            echo "Error: second run should refuse to overwrite"
            exit 1
          fi

  test-sync-photos:
    name: Test sync-photos.go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run unit tests
        run: go test -v -cover ./script/...

  build:
    runs-on: ubuntu-latest
    name: script/cibuild
    needs: [test-new-meeting, test-sync-photos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0
          bundler-cache: true
      - name: build
        run: script/bootstrap
      - name: test
        run: script/cibuild
      - name: Upload site artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
      - name: Upload Pages artifact
        if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

