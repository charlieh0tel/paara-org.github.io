name: Weekly Team Sync
on:
  schedule:
    - cron: 07 00 1-7 * *

jobs:
  create_issue:
    name: Rollover website after this month's club meeting
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create issue
        run: |
          if [ "$(date +%u)" = "1" ]; then
            new_issue_url=$(gh issue create \
              --title "$TITLE" \
              --assignee "$ASSIGNEES" \
              --label "$LABELS" \
              --body "$BODY")
            if [[ $PINNED == true ]]; then
              gh issue pin "$new_issue_url"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Rollover website after this month's club meeting
          ASSIGNEES: kn6yuh
          LABELS: monthly-rollover
          BODY: |

            Each of the main steps can be executed by a different person. For simplicity, I'm just creating a single bug.

            ### Add next month's meeting
            If next month's meeting page doesn't exist yet, run `./script/new-meeting` and commit the files it creates.
            The homepage moves on to the next meeting by itself; nothing else needs updating.

            ### Add YouTube video to the last meeting
            1. Upload recording to shared drive
            2. Edit the video
            3. Upload the video to the YT channel
            4. Link the video in the meeting page (see past meetings as examples)

            Resolve the issue when the next meeting page exists, and the YT video is uploaded and linked.

          PINNED: false
          CLOSE_PREVIOUS: false

